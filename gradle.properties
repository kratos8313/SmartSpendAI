# Project-wide Gradle settings.

# Increase heap size for Gradle daemon and worker processes
# Large projects with many dependencies (ML Kit, iText, etc.) require more memory
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Enable parallel execution and caching to optimize build speed
org.gradle.parallel=true
org.gradle.caching=true

# Standard AndroidX settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Workaround for jlink/JdkImageTransform error on some systems
android.useJdkImage=false
